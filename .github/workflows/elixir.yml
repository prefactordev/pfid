name: Elixir

on:
  push:
    branches: [main]
    paths:
      - "elixir/**"
      - "fixtures/**"
      - ".github/workflows/elixir.yml"
  pull_request:
    branches: [main]
    paths:
      - "elixir/**"
      - "fixtures/**"
      - ".github/workflows/elixir.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Supported Elixir/OTP pairs, per
        # https://hexdocs.pm/elixir/compatibility-and-deprecations.html
        # (Elixir 1.18.4+ also supports OTP 28.) Minimum is OTP 27, the oldest
        # OTP release still supported upstream, which in turn means Elixir 1.17.
        include:
          - { elixir: "1.17", otp: "27" }
          - { elixir: "1.18", otp: "27" }
          - { elixir: "1.18", otp: "28" }
          - { elixir: "1.19", otp: "27" }
          - { elixir: "1.19", otp: "28" }
          - { elixir: "1.20", otp: "27" }
          - { elixir: "1.20", otp: "28" }
          - { elixir: "1.20", otp: "29" }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: elixir/deps
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: elixir/_build
          key: ${{ runner.os }}-build-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: ${{ runner.os }}-build-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        working-directory: elixir
        run: mix deps.get

      - name: Compile
        working-directory: elixir
        run: mix compile --warnings-as-errors

      - name: Run tests
        working-directory: elixir
        run: mix test
